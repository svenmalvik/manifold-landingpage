  <style>
    :root {
      --canvas: #0d0b0a;
      --surface: #141210;
      --border: #2a2420;
      --accent: #c9a06d;
      --accent-hover: #d4ad7a;
      --text: #e8e0d4;
      --text-dim: #a1887f;
      --text-dimmer: #6d5d53;
      --chartreuse: #CCFF00;
      --logo-bg: #0A0A0A;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: var(--font-mono);
      font-weight: 700;
      line-height: 1.15;
    }

    h1 { font-size: 3.25rem; }
    h2 { font-size: 2rem; color: var(--accent); margin-bottom: 1rem; }
    h3 { font-size: 1.1rem; }

    p { font-size: 1.05rem; max-width: 600px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Nav */
    nav {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-brand span {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .nav-links a:hover {
      color: var(--text);
      text-decoration: none;
    }
  </style>
</head>

    </div>
